# ==============================================================================
# Crop Configuration: Tomato (Maharashtra Kharif/Rabi/Summer Season)
# Target Region: Nashik / Pune / Satara Vegetable Belts
# Sources:
#   - MPKV Rahuri Vegetable Cultivation Guide
#   - ICAR-Indian Institute of Horticultural Research (IIHR)
# ==============================================================================

crop_id: "tomato_maharashtra"
common_name_en: "Tomato"
common_name_hi: "टमाटर"
common_name_mr: "टोमॅटो"
scientific_name: "Solanum lycopersicum L."
typical_duration_days: 120 # MPKV recommends 110-130 days for determinate/indeterminate hybrids (Abhinav, Lakshmi)
region: "Maharashtra"

citations:
  - document: "MPKV Rahuri Vegetable Cultivation Guide"
    section: "Tomato Production Technology & Drip Irrigation, pp. 62-74"
  - document: "ICAR-IIHR Vegetable Crop Advisory Bulletins"
    section: "Blossom End Rot, Blossom Drop & High Heat Thresholds"

general_thresholds:
  heat_stress_warning_c: 35.0 # Temps >35C cause blossom drop and poor pollen viability
  heat_stress_source: "ICAR-IIHR Bulletin No. 8"
  frost_stress_warning_c: 8.0 # Extremely sensitive to cold/frost
  frost_stress_source: "MPKV PoP, p. 65"
  excess_rain_24h_mm: 35.0 # Susceptible to collar rot, bacterial wilt, and cracking
  excess_rain_source: "MPKV PoP, p. 68"

stages:
  - stage_id: "transplanting_establishment"
    name_en: "Transplanting & Establishment"
    name_hi: "रोपाई और स्थापना"
    name_mr: "पुनर्लागवड व स्थिरावणे"
    das_start: 1
    das_end: 25
    critical_for_irrigation: true
    critical_reason: "Frequent light irrigations essential to establish delicate rootlets"
    moisture:
      root_depth_cm: 20
      depletion_trigger_pct: 40.0
      waterlogging_threshold_pct: 80.0
      source: "MPKV PoP, p. 64"
    temperature:
      min_optimal_c: 18.0
      max_optimal_c: 30.0
      heat_stress_c: 35.0
      frost_stress_c: 10.0
      source: "MPKV PoP, p. 64"
    spraying:
      max_wind_kmh: 10.0
      min_temp_c: 16.0
      max_temp_c: 32.0
      max_rain_probability_pct: 25.0
      min_relative_humidity_pct: 50.0
      source: "ICAR-IIHR Guidelines, p. 5"

  - stage_id: "vegetative_branching"
    name_en: "Vegetative & Branching"
    name_hi: "वानस्पतिक शाखाएं निकलना"
    name_mr: "शाकीय वाढ व फांद्या फुटणे"
    das_start: 26
    das_end: 50
    critical_for_irrigation: false
    critical_reason: "Promote sturdy canopy growth"
    moisture:
      root_depth_cm: 30
      depletion_trigger_pct: 35.0
      waterlogging_threshold_pct: 80.0
      source: "MPKV PoP, p. 66"
    temperature:
      min_optimal_c: 18.0
      max_optimal_c: 30.0
      heat_stress_c: 35.0
      frost_stress_c: 10.0
      source: "MPKV PoP, p. 66"
    spraying:
      max_wind_kmh: 12.0
      min_temp_c: 16.0
      max_temp_c: 33.0
      max_rain_probability_pct: 30.0
      min_relative_humidity_pct: 45.0
      source: "ICAR-IIHR Guidelines, p. 7"

  - stage_id: "flowering_fruit_set"
    name_en: "Flowering & Fruit Set"
    name_hi: "फूल आना और फल लगना"
    name_mr: "फुलोरा व फळधारणा"
    das_start: 51
    das_end: 85
    critical_for_irrigation: true
    critical_reason: "Uneven soil moisture causes severe blossom drop and blossom-end rot (calcium transport failure)"
    moisture:
      root_depth_cm: 40
      depletion_trigger_pct: 45.0
      waterlogging_threshold_pct: 80.0
      source: "MPKV PoP, p. 69"
    temperature:
      min_optimal_c: 20.0
      max_optimal_c: 30.0
      heat_stress_c: 34.0
      frost_stress_c: 12.0
      source: "MPKV PoP, p. 69"
    spraying:
      max_wind_kmh: 10.0
      min_temp_c: 18.0
      max_temp_c: 31.0
      max_rain_probability_pct: 20.0
      min_relative_humidity_pct: 50.0
      source: "ICAR-IIHR Guidelines, p. 9"

  - stage_id: "fruit_maturity_harvest"
    name_en: "Fruit Maturity & Harvesting"
    name_hi: "फल पकना और तुड़ाई"
    name_mr: "फळे पिकणे व तोडणी"
    das_start: 86
    das_end: 120
    critical_for_irrigation: false
    critical_reason: "Moderate regular irrigation prevents fruit cracking"
    moisture:
      root_depth_cm: 40
      depletion_trigger_pct: 35.0
      waterlogging_threshold_pct: 75.0
      source: "MPKV PoP, p. 72"
    temperature:
      min_optimal_c: 18.0
      max_optimal_c: 30.0
      heat_stress_c: 35.0
      frost_stress_c: 10.0
      source: "MPKV PoP, p. 72"
    spraying:
      max_wind_kmh: 12.0
      min_temp_c: 16.0
      max_temp_c: 32.0
      max_rain_probability_pct: 20.0
      min_relative_humidity_pct: 40.0
      source: "ICAR-IIHR Guidelines, p. 12"
